# ========================================
# CANOPOLIS - Configuración para Railway
# ========================================

# Puerto del servidor (Railway lo asigna automáticamente)
server.port=${PORT:8080}

# Base de datos MySQL (variables de Railway)
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/demo_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate - crear/actualizar tablas automáticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Jackson - para serialización JSON
spring.jackson.serialization.write-dates-as-timestamps=false